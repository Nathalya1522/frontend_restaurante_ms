<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabores del Mundo - Inicio de Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="login-wrap">

        <div class="login-izquierda">
            <div class="login-logo">
                <div class="neon-rosa">Sabores</div>
                <div>del</div>
                <div class="neon-azul">Mundo</div>
            </div>
            <p class="login-subtitulo">El mejor restaurante de la ciudad 🍽️</p>

            <div class="food-grid">
                <div class="food-item">
                    <p>🍕</p>
                    <p>Pizzas</p>
                </div>
                <div class="food-item">
                    <p>🍔</p>
                    <p>Hamburguesas</p>
                </div>
                <div class="food-item">
                    <p>🥗</p>
                    <p>Ensaladas</p>
                </div>
                <div class="food-item">
                    <p>🍮</p>
                    <p>Postres</p>
                </div>
                <div class="food-item">
                    <p>🥤</p>
                    <p>Bebidas</p>
                </div>
                <div class="food-item">
                    <p>🥩</p>
                    <p>Carnes</p>
                </div>
            </div>
        </div>

        <div class="login-derecha">
            <h2>¡Bienvenido <span>de vuelta!</span></h2>
            <p class="login-subtexto">Inicia sesión para gestionar el restaurante</p>

            <div id="mensaje"></div>

            <form id="formLogin">
                <div class="form-group">
                    <label for="usuario">Usuario o Correo</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" required>
                </div>
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Tu contraseña" required>
                </div>
                <button type="submit" class="btn-primario">Ingresar →</button>
            </form>
        </div>

    </div>

    <script src="js/auth.js"></script>
</body>
</html>
