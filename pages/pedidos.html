<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabores del Mundo - Pedidos</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar">
        <a class="navbar-brand" href="dashboard.html"><span>Sabores</span> del Mundo</a>
        <ul class="navbar-nav">
            <li><a href="dashboard.html">Inicio</a></li>
            <li><a href="mesas.html">Mesas</a></li>
            <li><a href="reservas.html">Reservas</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="pedidos.html" class="activo">Pedidos</a></li>
        </ul>
        <button class="btn-logout" id="btnCerrarSesion">Cerrar sesión</button>
    </nav>

    <div class="main-content">

        <div class="page-header">
            <h2>🛒 Pedidos</h2>
            <p>Gestiona los pedidos de las mesas</p>
        </div>

        <div class="layout-2col">

            <div class="panel">
                <h3>Nuevo Pedido</h3>
                <div id="mensajePedido"></div>

                <div class="form-group">
                    <label for="mesa_id">Mesa</label>
                    <select id="mesa_id" name="mesa_id">
                        <option value="">Selecciona una mesa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="producto_id">Producto</label>
                    <select id="producto_id" name="producto_id">
                        <option value="">Selecciona un producto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" name="cantidad" placeholder="Ej: 2" min="1" value="1">
                </div>
                <div class="form-group">
                    <label for="observaciones">Observaciones (opcional)</label>
                    <textarea id="observaciones" name="observaciones" placeholder="Ej: sin cebolla..."></textarea>
                </div>

                <button type="button" class="btn-primario" id="btnGuardarPedido">Crear Pedido</button>
                <button type="button" class="btn-secundario" id="btnLimpiarPedido">Limpiar</button>
            </div>

            <div>
                <div class="filtros">
                    <select id="filtroEstado">
                        <option value="">Todos los estados</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="en_preparacion">En preparación</option>
                        <option value="entregado">Entregado</option>
                        <option value="pagado">Pagado</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </div>
                <div class="cards-grid" id="listaPedidos"></div>
            </div>

        </div>
    </div>

    <script src="../js/pedidos.js"></script>
</body>
</html>
