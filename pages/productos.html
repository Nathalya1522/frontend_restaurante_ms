<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabores del Mundo - Productos</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar">
        <a class="navbar-brand" href="dashboard.html"><span>Sabores</span> del Mundo</a>
        <ul class="navbar-nav">
            <li><a href="dashboard.html">Inicio</a></li>
            <li><a href="mesas.html">Mesas</a></li>
            <li><a href="reservas.html">Reservas</a></li>
            <li><a href="productos.html" class="activo">Productos</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
        </ul>
        <button class="btn-logout" id="btnCerrarSesion">Cerrar sesión</button>
    </nav>

    <div class="main-content">

        <div class="page-header">
            <h2>🍽️ Productos</h2>
            <p>Gestiona el menú del restaurante</p>
        </div>

        <div class="layout-2col">

            <div class="panel">
                <h3 id="tituloFormulario">Nuevo Producto</h3>
                <div id="mensajeProducto"></div>

                <div class="form-group">
                    <label for="nombre">Nombre del producto</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Pizza Margarita">
                </div>
                <div class="form-group">
                    <label for="precio">Precio ($)</label>
                    <input type="number" id="precio" name="precio" placeholder="Ej: 25000" min="0" step="100">
                </div>
                <div class="form-group">
                    <label for="categoria_id">Categoría</label>
                    <select id="categoria_id" name="categoria_id">
                        <option value="">Selecciona categoría</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción (opcional)</label>
                    <textarea id="descripcion" name="descripcion" placeholder="Describe el producto..."></textarea>
                </div>
                <div class="form-group">
                    <label for="disponible">Disponibilidad</label>
                    <select id="disponible" name="disponible">
                        <option value="1">Disponible</option>
                        <option value="0">No disponible</option>
                    </select>
                </div>

                <button type="button" class="btn-primario" id="btnGuardarProducto">Guardar Producto</button>
                <button type="button" class="btn-secundario" id="btnCancelarProducto">Limpiar</button>
            </div>

            <div>
                <div class="filtros">
                    <select id="filtroCategoria">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
                <div class="cards-grid" id="listaProductos"></div>
            </div>

        </div>
    </div>

    <script src="../js/productos.js"></script>
</body>
</html>
