<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabores del Mundo - Productos</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a class="navbar-brand" href="dashboard.html">Sabores del Mundo</a>
        <ul class="navbar-nav">
            <li><a href="dashboard.html">Inicio</a></li>
            <li><a href="mesas.html">Mesas</a></li>
            <li><a href="reservas.html">Reservas</a></li>
            <li><a href="productos.html" class="active">Productos</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
        </ul>
        <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
    </nav>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="page-header">
            <h2>Gestión de Productos</h2>
            <p>Administra el menú del restaurante</p>
        </div>

        <!-- Formulario crear producto -->
        <div class="form-container">
            <h3 id="tituloFormulario">Crear Nuevo Producto</h3>
            <div id="mensajeProducto"></div>
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="nombre" placeholder="Ej: Hamburguesa Especial">
                </div>
                <div class="form-group">
                    <label>Precio</label>
                    <input type="number" id="precio" placeholder="Ej: 25000" min="1">
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="categoria_id">
                        <option value="">Selecciona una categoría</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="descripcion" placeholder="Descripción del producto" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Disponible</label>
                    <select id="disponible">
                        <option value="1">Sí</option>
                        <option value="0">No</option>
                    </select>
                </div>
            </div>
            <button class="btn-primary" onclick="guardarProducto()" style="width:auto; padding: 10px 30px;">Guardar Producto</button>
            <button class="btn-secondary" onclick="cancelarEdicion()">Cancelar</button>
        </div>

        <!-- Filtros -->
        <div class="filtros">
            <div class="form-group">
                <label>Filtrar por categoría</label>
                <select id="filtroCategoria" onchange="filtrarProductos()">
                    <option value="">Todas</option>
                </select>
            </div>
        </div>

        <!-- Lista de productos -->
        <div id="listaProductos" class="cards-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando productos...</p>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/productos.js"></script>
</body>
</html>
