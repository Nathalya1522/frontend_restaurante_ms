<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabores del Mundo - Reservas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a class="navbar-brand" href="dashboard.html">Sabores del Mundo</a>
        <ul class="navbar-nav">
            <li><a href="dashboard.html">Inicio</a></li>
            <li><a href="mesas.html">Mesas</a></li>
            <li><a href="reservas.html" class="active">Reservas</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
        </ul>
        <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
    </nav>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="page-header">
            <h2>Gestión de Reservas</h2>
            <p>Administra las reservas de los clientes</p>
        </div>

        <!-- Formulario crear reserva -->
        <div class="form-container">
            <h3 id="tituloFormulario">Crear Nueva Reserva</h3>
            <div id="mensajeReserva"></div>
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre del Cliente</label>
                    <input type="text" id="nombre_cliente" placeholder="Nombre completo">
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="telefono_cliente" placeholder="Ej: 3001234567">
                </div>
                <div class="form-group">
                    <label>Cantidad de Personas</label>
                    <input type="number" id="cantidad_personas" placeholder="Ej: 4" min="1">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="fecha">
                </div>
                <div class="form-group">
                    <label>Hora</label>
                    <input type="time" id="hora">
                </div>
                <div class="form-group">
                    <label>Mesa</label>
                    <select id="mesa_id">
                        <option value="">Selecciona una mesa</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Estado</label>
                    <select id="estado">
                        <option value="pendiente">Pendiente</option>
                        <option value="confirmada">Confirmada</option>
                        <option value="cancelada">Cancelada</option>
                        <option value="finalizada">Finalizada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Observaciones</label>
                    <textarea id="observaciones" placeholder="Observaciones adicionales" rows="2"></textarea>
                </div>
            </div>
            <button class="btn-primary" onclick="guardarReserva()" style="width:auto; padding: 10px 30px;">Guardar Reserva</button>
            <button class="btn-secondary" onclick="cancelarEdicion()">Cancelar</button>
        </div>

        <!-- Filtros -->
        <div class="filtros">
            <div class="form-group">
                <label>Buscar por fecha</label>
                <input type="date" id="filtroFecha" onchange="filtrarReservas()">
            </div>
            <div class="form-group">
                <label>Buscar por estado</label>
                <select id="filtroEstado" onchange="filtrarReservas()">
                    <option value="">Todos</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="confirmada">Confirmada</option>
                    <option value="cancelada">Cancelada</option>
                    <option value="finalizada">Finalizada</option>
                </select>
            </div>
            <div class="form-group">
                <label>Buscar por cliente</label>
                <input type="text" id="filtroCliente" placeholder="Nombre del cliente" oninput="filtrarReservas()">
            </div>
        </div>

        <!-- Lista de reservas -->
        <div id="listaReservas" class="cards-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando reservas...</p>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/reservas.js"></script>
</body>
</html>
