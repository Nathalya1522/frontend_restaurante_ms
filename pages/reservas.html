<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabores del Mundo - Reservas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar">
        <a class="navbar-brand" href="dashboard.html"><span>Sabores</span> del Mundo</a>
        <ul class="navbar-nav">
            <li><a href="dashboard.html">Inicio</a></li>
            <li><a href="mesas.html">Mesas</a></li>
            <li><a href="reservas.html" class="activo">Reservas</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
        </ul>
        <button class="btn-logout" id="btnCerrarSesion">Cerrar sesión</button>
    </nav>

    <div class="main-content">

        <div class="page-header">
            <h2>📋 Reservas</h2>
            <p>Gestiona las reservas de los clientes</p>
        </div>

        <div class="layout-2col">

            <div class="panel">
                <h3 id="tituloFormulario">Nueva Reserva</h3>
                <div id="mensajeReserva"></div>

                <div class="form-group">
                    <label for="nombre_cliente">Nombre del cliente</label>
                    <input type="text" id="nombre_cliente" name="nombre_cliente" placeholder="Nombre completo">
                </div>
                <div class="form-group">
                    <label for="telefono_cliente">Teléfono</label>
                    <input type="text" id="telefono_cliente" name="telefono_cliente" placeholder="Ej: 3001234567">
                </div>
                <div class="form-group">
                    <label for="cantidad_personas">Cantidad de personas</label>
                    <input type="number" id="cantidad_personas" name="cantidad_personas" placeholder="Ej: 4" min="1">
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha">
                </div>
                <div class="form-group">
                    <label for="hora">Hora</label>
                    <input type="time" id="hora" name="hora">
                </div>
                <div class="form-group">
                    <label for="mesa_id">Mesa</label>
                    <select id="mesa_id" name="mesa_id">
                        <option value="">Selecciona una mesa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="pendiente">Pendiente</option>
                        <option value="confirmada">Confirmada</option>
                        <option value="cancelada">Cancelada</option>
                        <option value="finalizada">Finalizada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="observaciones">Observaciones (opcional)</label>
                    <textarea id="observaciones" name="observaciones" placeholder="Notas adicionales..."></textarea>
                </div>

                <button type="button" class="btn-primario" id="btnGuardarReserva">Guardar Reserva</button>
                <button type="button" class="btn-secundario" id="btnCancelarReserva">Limpiar</button>
            </div>

            <div>
                    <div class="filtros">
                        <input type="date" id="filtroFecha" placeholder="Buscar por fecha">
                        <input type="text" id="filtroCliente" placeholder="Buscar por cliente">
                        <select id="filtroEstado">
                            <option value="">Todos los estados</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="confirmada">Confirmada</option>
                            <option value="cancelada">Cancelada</option>
                            <option value="finalizada">Finalizada</option>
                        </select>
                        <button type="button" id="btnFiltrar" class="btn-primario">Buscar</button>
                        <button type="button" id="btnLimpiarFiltro" class="btn-secundario">Limpiar</button>
                    </div>
                <div class="cards-grid" id="listaReservas"></div>
            </div>

        </div>
    </div>

    <script src="../js/reservas.js"></script>
</body>
</html>
