<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabores del Mundo - Mesas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a class="navbar-brand" href="dashboard.html">Sabores del Mundo</a>
        <ul class="navbar-nav">
            <li><a href="dashboard.html">Inicio</a></li>
            <li><a href="mesas.html" class="active">Mesas</a></li>
            <li><a href="reservas.html">Reservas</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
        </ul>
        <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
    </nav>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="page-header">
            <h2>Gestión de Mesas</h2>
            <p>Administra las mesas del restaurante</p>
        </div>

        <!-- Formulario crear mesa -->
        <div class="form-container">
            <h3 id="tituloFormulario">Crear Nueva Mesa</h3>
            <div id="mensajeMesa"></div>
            <div class="form-row">
                <div class="form-group">
                    <label>Número de Mesa</label>
                    <input type="text" id="numero" placeholder="Ej: MESA-5">
                </div>
                <div class="form-group">
                    <label>Capacidad</label>
                    <input type="number" id="capacidad" placeholder="Ej: 4" min="1">
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="estado">
                        <option value="disponible">Disponible</option>
                        <option value="reservada">Reservada</option>
                        <option value="ocupada">Ocupada</option>
                        <option value="fuera_servicio">Fuera de Servicio</option>
                    </select>
                </div>
            </div>
            <button class="btn-primary" onclick="guardarMesa()" style="width:auto; padding: 10px 30px;">Guardar Mesa</button>
            <button class="btn-secondary" onclick="cancelarEdicion()">Cancelar</button>
        </div>

        <!-- Lista de mesas -->
        <div id="listaMesas" class="cards-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando mesas...</p>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/mesas.js"></script>
</body>
</html>
