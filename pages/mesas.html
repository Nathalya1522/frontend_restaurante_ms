<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabores del Mundo - Mesas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar">
        <a class="navbar-brand" href="dashboard.html"><span>Sabores</span> del Mundo</a>
        <ul class="navbar-nav">
            <li><a href="dashboard.html">Inicio</a></li>
            <li><a href="mesas.html" class="activo">Mesas</a></li>
            <li><a href="reservas.html">Reservas</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
        </ul>
        <button class="btn-logout" id="btnCerrarSesion">Cerrar sesión</button>
    </nav>

    <div class="main-content">

        <div class="page-header">
            <h2>🪑 Mesas</h2>
            <p>Gestiona las mesas del restaurante</p>
        </div>

        <div class="layout-2col">

            <div class="panel">
                <h3 id="tituloFormulario">Nueva Mesa</h3>
                <div id="mensajeMesa"></div>

                <div class="form-group">
                    <label for="numero">Número de mesa</label>
                    <input type="text" id="numero" name="numero" placeholder="Ej: Mesa 1">
                </div>
                <div class="form-group">
                    <label for="capacidad">Capacidad (personas)</label>
                    <input type="number" id="capacidad" name="capacidad" placeholder="Ej: 4" min="1">
                </div>
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="disponible">Disponible</option>
                        <option value="ocupada">Ocupada</option>
                        <option value="reservada">Reservada</option>
                        <option value="mantenimiento">Mantenimiento</option>
                    </select>
                </div>

                <button type="button" class="btn-primario" id="btnGuardarMesa">Guardar Mesa</button>
                <button type="button" class="btn-secundario" id="btnCancelarMesa">Limpiar</button>
            </div>

            <div>
                <div class="filtros">
                    <select id="filtroEstado">
                        <option value="">Todos los estados</option>
                        <option value="disponible">Disponible</option>
                        <option value="ocupada">Ocupada</option>
                        <option value="reservada">Reservada</option>
                        <option value="mantenimiento">Mantenimiento</option>
                    </select>
                </div>
                <div class="cards-grid" id="listaMesas"></div>
            </div>

        </div>
    </div>

    <script src="../js/mesas.js"></script>
</body>
</html>
